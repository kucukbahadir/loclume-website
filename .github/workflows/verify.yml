name: verify
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated pages are up to date
        run: node tools/build.mjs --check
      - name: Release gate (links, SEO, i18n, CSP, sitemap)
        run: node tools/verify.mjs
      - name: Stage public files only
        run: bash tools/stage.sh
